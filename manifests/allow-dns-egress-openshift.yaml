# Allow DNS egress to openshift-dns (OCP). Use with default-deny-all-egress in same namespace.
# Set metadata.namespace to the namespace where you applied default-deny-all-egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-to-openshift-dns
  namespace: default
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
